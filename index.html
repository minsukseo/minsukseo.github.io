<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minsuk Seo - Materials Engineer</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: white;
            color: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.4;
            font-size: 16px;
        }

        .wrapper {
            display: flex;
            max-width: 1200px;
            margin: 0 auto;
        }

        .sidebar {
            width: 250px;
            padding: 50px 35px;
            border-right: 1px solid #e0e0e0;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .main-content {
            flex: 1;
            padding: 50px 35px;
        }

        h1 { font-size: 1.75rem; margin-bottom: 8px; font-weight: 700; }
        h2 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 8px;
        }

        /* TEM slider container */
        .tem-slider {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            overflow: hidden;
        }

        /* Main image */
        #temImage {
            width: 100%;
            display: block;
            border: 1px solid #e0e0e0;
            position: relative;
            z-index: 2;
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
        }

        /* Background preview image (next image) */
        #previewImage {
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0.25;
            filter: blur(2px);
            z-index: 1;
            transition: opacity 0.5s ease-in-out;
        }

        /* Caption */
        .tem-caption {
            font-size: 0.85rem;
            color: #666;
            margin-top: 10px;
            text-align: center;
        }

        /* Arrow buttons */
        .arrow-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2.2rem;
            color: #888;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 3;
            padding: 5px 10px;
            transition: 0.2s;
        }

        .arrow-btn:hover {
            color: #555;
        }

        #prevBtn { left: 10px; }
        #nextBtn { right: 10px; }

        @media (max-width: 900px) {
            .wrapper { flex-direction: column; }
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #e0e0e0;
                padding: 35px;
                position: static;
                height: auto;
            }
            .main-content { padding: 35px; }
        }

        @media (max-width: 600px) {
            .sidebar { padding: 25px 18px; }
            .main-content { padding: 25px 18px; }
        }
    </style>
</head>

<body>
<div class="wrapper">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h1>Minsuk Seo</h1>
        <p class="title">Materials Engineer</p>

        <section id="contact">
            <h2>Contact</h2>
            <a href="mailto:msseo@illinois.edu">Email</a><br>
            <a href="https://www.linkedin.com/in/minsukseo/" target="_blank">LinkedIn</a>
            <div class="address">
                1304 W. Green St. MC 246<br>Urbana, IL 61801
            </div>
        </section>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="main-content">

        <!-- ABOUT -->
        <section id="about">
            <div class="about-text">
                <p>I am a postdoctoral researcher at the University of Illinois Urbana-Champaign (UIUC)...</p>
            </div>
        </section>

        <!-- PROJECTS -->
        <section id="projects">
            <h2>Projects</h2>
            <!-- (Your project content stays unchanged) -->
        </section>

        <!-- TEM SLIDER -->
        <section id="tem-gallery">
            <h2>TEM Microstructure</h2>

            <div class="tem-slider" id="slider">

                <!-- Background preview image -->
                <img id="previewImage" src="FIB.png" alt="Preview">

                <!-- Main image -->
                <img id="temImage" src="nanoTEM.png" alt="TEM">

                <!-- Arrows -->
                <button id="prevBtn" class="arrow-btn">&lt;</button>
                <button id="nextBtn" class="arrow-btn">&gt;</button>

                <p id="temCaption" class="tem-caption">
                    STEM DF cross-sectional microstructure (200 kV, 7.26 kx).
                </p>
            </div>
        </section>

        <!-- OTHER SECTIONS (Invited Talks, Skills, etc.) -->
        <!-- (Your existing content stays unchanged) -->

    </div>
</div>

<script>
    const images = [
        {
            src: "nanoTEM.png",
            caption: "STEM DF cross-sectional microstructure (200 kV, 7.26 kx)."
        },
        {
            src: "FIB.png",
            caption: "FIB cross-sectional lamella prepared for TEM analysis."
        }
    ];

    let currentIndex = 0;

    const temImage = document.getElementById("temImage");
    const previewImage = document.getElementById("previewImage");
    const temCaption = document.getElementById("temCaption");
    const slider = document.getElementById("slider");

    function updateImages(nextIndex) {
        // Fade out main image
        temImage.style.opacity = 0;

        setTimeout(() => {
            // Update main image
            temImage.src = images[nextIndex].src;
            temCaption.innerHTML = images[nextIndex].caption;

            // Update preview image to the next-next image
            const previewIndex = (nextIndex + 1) % images.length;
            previewImage.src = images[previewIndex].src;

            // Fade in main image
            temImage.style.opacity = 1;
        }, 500);
    }

    document.getElementById("prevBtn").onclick = () => {
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        updateImages(currentIndex);
    };

    document.getElementById("nextBtn").onclick = () => {
        currentIndex = (currentIndex + 1) % images.length;
        updateImages(currentIndex);
    };

    /* Mobile swipe gesture */
    let startX = 0;

    slider.addEventListener("touchstart", (e) => {
        startX = e.touches[0].clientX;
    });

    slider.addEventListener("touchend", (e) => {
        let endX = e.changedTouches[0].clientX;
        let diff = endX - startX;

        if (Math.abs(diff) > 50) {
            if (diff < 0) {
                currentIndex = (currentIndex + 1) % images.length;
            } else {
                currentIndex = (currentIndex - 1 + images.length) % images.length;
            }
            updateImages(currentIndex);
        }
    });
</script>

</body>
</html>
